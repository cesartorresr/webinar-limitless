const COUNTRIES = ["Brasil", "México", "Colombia", "Chile", "Perú", "Argentina", "Panamá", "Costa Rica", "Ecuador", "Guatemala", "República Dominicana", "Uruguay", "Paraguay", "Bolivia", "El Salvador", "Honduras", "Venezuela", "Estados Unidos", "España", "Otro"];
const TZ_COUNTRY = { "America/Sao_Paulo": "Brasil", "America/Bahia": "Brasil", "America/Fortaleza": "Brasil", "America/Recife": "Brasil", "America/Manaus": "Brasil", "America/Mexico_City": "México", "America/Monterrey": "México", "America/Bogota": "Colombia", "America/Santiago": "Chile", "America/Lima": "Perú", "America/Argentina/Buenos_Aires": "Argentina", "America/Panama": "Panamá", "America/Costa_Rica": "Costa Rica", "America/Guayaquil": "Ecuador", "America/Guatemala": "Guatemala", "America/Santo_Domingo": "República Dominicana", "America/Montevideo": "Uruguay", "America/Asuncion": "Paraguay", "America/La_Paz": "Bolivia", "America/El_Salvador": "El Salvador", "America/Tegucigalpa": "Honduras", "America/Caracas": "Venezuela", "America/New_York": "Estados Unidos", "America/Chicago": "Estados Unidos", "America/Denver": "Estados Unidos", "America/Los_Angeles": "Estados Unidos", "Europe/Madrid": "España" };

/* ════ De aquí para abajo, el motor (no se toca por evento) ════ */
const E = EVENTO, T = UI[E.lang] || UI.es;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const locale = { es: "es", pt: "pt-BR", en: "en-US" }[E.lang] || "es";
const start = new Date(E.start), end = new Date(start.getTime() + E.duration * 60000);
// ?simular=antes muestra la página como si faltaran 3 días (para revisar antes de publicar)
const params = new URLSearchParams(location.search);
const now = () => (params.get("simular") === "antes" ? new Date(start.getTime() - 3 * 864e5 + (Date.now() % 864e5)) : new Date());
const ended = () => now() > end;

document.documentElement.lang = locale;
document.documentElement.style.setProperty("--brand", E.sponsor.brand);
document.documentElement.style.setProperty("--accent", E.sponsor.accent);
if (!FORMS_URL) { $("test-bar").style.display = "block"; $("test-bar").textContent = T.testBar; }

// Portada
$("sponsor-logo").src = E.sponsor.logo; $("sponsor-logo").alt = E.sponsor.name;
if (E.heroImage) $("hero-bg").style.backgroundImage = `url('${E.heroImage}')`;
$("pill").textContent = E.pill; $("hook").textContent = E.hook; $("title").innerHTML = E.title; $("sub").textContent = E.sub;

// Fecha en la hora de quien visita, más la hora de referencia del evento
const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
const fmt = (d, tz, opts) => new Intl.DateTimeFormat(locale, { timeZone: tz, ...opts }).format(d);
const dayTxt = fmt(start, userTz, { weekday: "long", day: "numeric", month: "long" });
const timeTxt = fmt(start, userTz, { hour: "2-digit", minute: "2-digit" });
const refTxt = fmt(start, E.refTimeZone, { hour: "2-digit", minute: "2-digit" });
$("when").innerHTML =
  `<span class="chip"><b>${esc(dayTxt.charAt(0).toUpperCase() + dayTxt.slice(1))}</b></span>` +
  `<span class="chip"><b>${esc(timeTxt)}</b><span>${esc(T.yourTime)}${userTz !== E.refTimeZone ? ` · ${esc(refTxt)} ${esc(E.refTimeLabel)}` : ""}</span></span>` +
  `<span class="chip"><span>${esc(T.free)} · ${E.duration} min</span></span>`;
$("tz-note").textContent = `${T.when}: ${timeTxt} (${userTz.split("/").pop().replace(/_/g, " ")})`;

// Cuenta regresiva
function tick() {
  const ms = start - now();
  if (ms <= 0) { $("cd").innerHTML = ended() ? "" : `<div class="glass"><div class="n">●</div><div class="l">${esc(T.live)}</div></div>`; return; }
  const u = [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60];
  $("cd").innerHTML = [T.days, T.hours, T.min, T.sec].map((l, i) => `<div class="glass"><div class="n">${String(u[i]).padStart(2, "0")}</div><div class="l">${esc(l)}</div></div>`).join("");
}
tick(); setInterval(tick, 1000);

// Secciones
$("p-label").textContent = T.pLabel; $("p-title").textContent = E.problem.title; $("p-body").textContent = E.problem.body;
$("stats").innerHTML = E.problem.stats.map(([v, k]) => `<div class="glass stat"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("");
$("dl-label").textContent = T.dlLabel; $("dl-title").textContent = T.dlTitle;
$("cards").innerHTML = E.deliverables.map(([h, p]) => `<div class="glass card"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
$("sp-label").textContent = T.spLabel; $("sp-title").textContent = T.spTitle;
$("speakers").innerHTML = E.speakers.map((s) => `<div class="glass spk">${s.photo ? `<img class="ph" src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy">` : `<div class="ph">${esc(s.name.split(" ").map((w) => w[0]).slice(0, 2).join(""))}</div>`}<span class="tag">${esc(s.tag)}</span><h3>${esc(s.name)}</h3><div class="role">${esc(s.role)}</div><p>${esc(s.bio)}</p></div>`).join("");
$("ag-label").textContent = T.agLabel; $("ag-title").textContent = T.agTitle;
$("agenda").innerHTML = E.agenda.map(([h, t, p]) => `<div class="glass ag"><div class="h">${esc(h)}</div><div><h3>${esc(t)}</h3><p>${esc(p)}</p></div></div>`).join("");
$("au-label").textContent = T.auLabel; $("au-title").textContent = T.auTitle;
$("audience").innerHTML = E.audience.map((a) => `<span class="chip"><b>${esc(a)}</b></span>`).join("");
$("final-title").textContent = E.finalTitle; $("final-sub").textContent = T.finalSub;
$("footer").textContent = `${E.sponsor.name} × ${T.footer}`;

// Formulario
["name", "email", "company", "role", "country", "consent"].forEach((k) => ($("l-" + k).textContent = T[k]));
$("f-title").textContent = T.fTitle; $("f-sub").textContent = T.fSub; $("fine").textContent = T.fine;
const guess = TZ_COUNTRY[userTz];
$("country").innerHTML = COUNTRIES.map((c) => `<option${c === guess ? " selected" : ""}>${esc(c)}</option>`).join("");
const setCtas = () => {
  const done = ended();
  $("submit").textContent = done ? T.endedSubmit : T.submit;
  $("final-cta").textContent = $("sticky-cta").textContent = done && E.replayUrl ? T.endedCta : T.cta;
  if (done) {
    $("f-title").textContent = T.endedForm; $("pill").textContent = T.ended;
    if (E.replayUrl) $("final-cta").href = $("sticky-cta").href = E.replayUrl;
  }
};
setCtas();

// En celular, la barra fija se esconde mientras el formulario está a la vista
new IntersectionObserver(([e]) => document.querySelector(".sticky").classList.toggle("hide", e.isIntersecting), { threshold: 0.15 }).observe($("register"));

// Origen de la visita: ?utm_source=linkedin, ?ref=whatsapp o el sitio de donde viene
const source = params.get("utm_source") || params.get("ref") || (document.referrer ? new URL(document.referrer).hostname : "");

// Calendario
const utc = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
const plainTitle = E.title.replace(/<[^>]+>/g, "");
const pageUrl = location.origin + location.pathname;
function calendarLinks() {
  $("cal-google").href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(plainTitle)}&dates=${utc(start)}/${utc(end)}&details=${encodeURIComponent(pageUrl)}`;
  $("cal-outlook").href = `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(plainTitle)}&startdt=${start.toISOString()}&enddt=${end.toISOString()}&body=${encodeURIComponent(pageUrl)}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Limitless Media//Webinar//ES", "BEGIN:VEVENT", `UID:${E.slug}@thelimitlessmedia.co`, `DTSTAMP:${utc(new Date())}`, `DTSTART:${utc(start)}`, `DTEND:${utc(end)}`, `SUMMARY:${plainTitle.replace(/[,;]/g, " ")}`, `URL:${pageUrl}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  $("cal-ics").href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  $("cal-google").textContent = T.gcal; $("cal-outlook").textContent = T.outlook; $("cal-ics").textContent = T.ics;
  const share = `${T.shareText} ${plainTitle} ${pageUrl}?ref=colega`;
  $("s-wa").href = `https://wa.me/?text=${encodeURIComponent(share)}`;
  $("s-li").href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl + "?ref=linkedin-share")}`;
  $("s-title").textContent = T.sTitle; $("s-copy").textContent = T.copy;
  $("s-copy").onclick = () => navigator.clipboard.writeText(`${pageUrl}?ref=colega`).then(() => ($("s-copy").textContent = T.copied));
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const data = Object.fromEntries(f.entries());
  const ok = data.name.trim() && /\S+@\S+\.\S+/.test(data.email) && data.company.trim() && f.get("consent");
  if (!ok) { $("err").textContent = T.errReq; $("err").style.display = "block"; return; }
  $("err").style.display = "none";
  $("submit").disabled = true; $("submit").textContent = T.sending;
  const payload = { type: "webinar", event: E.slug, title: plainTitle, start: E.start, duration: E.duration, lang: E.lang, page: pageUrl,
    name: data.name.trim(), email: data.email.trim(), company: data.company.trim(), role: (data.role || "").trim(), country: data.country,
    consent: true, source, website: data.website || "" };
  try {
    if (FORMS_URL) {
      // text/plain + no-cors: Google no acepta la consulta previa del navegador; el dato llega igual.
      await fetch(FORMS_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    } else {
      console.warn("MODO PRUEBA: esta inscripción no se guardó", payload);
    }
    calendarLinks();
    $("form").style.display = "none"; $("done").style.display = "block";
    $("d-title").textContent = T.dTitle; $("d-sub").textContent = T.dSub;
    document.querySelector(".sticky").style.display = "none";
    $("register").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (e) {
    $("err").textContent = T.errNet; $("err").style.display = "block";
    $("submit").disabled = false; setCtas();
  }
});
</script>
</body>
</html>
