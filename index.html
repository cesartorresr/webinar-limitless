<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#03070F;--bg2:#060E1C;--card:rgba(8,20,40,.66);
    --text:#F3F1EC;--text2:#9DAEC4;--dim:#5E7390;
    --brand:#1A56A8;--accent:#E8912D;--gold:#D4A843;
    --line:rgba(120,160,220,.15);--radius:16px;
  }
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit}
  img{max-width:100%;display:block}
  h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;line-height:1.06}
  .mono{font-family:'IBM Plex Mono',monospace}
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px}
  .label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px}
  .label::before{content:'';width:22px;height:1px;background:var(--accent)}

  /* ── Capa futurista ── */
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 85% 70% at 50% 35%,#000 25%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 35%,#000 25%,transparent 80%);pointer-events:none}
  .floor{position:absolute;left:-30%;right:-30%;bottom:-8%;height:42%;background-image:linear-gradient(color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent) 1px,transparent 1px);background-size:70px 70px;transform:perspective(560px) rotateX(64deg);transform-origin:center top;mask-image:linear-gradient(#000,transparent 80%);-webkit-mask-image:linear-gradient(#000,transparent 80%);animation:floor 7s linear infinite;opacity:.55;pointer-events:none}
  @keyframes floor{to{background-position:0 70px}}
  .orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;animation:drift 18s ease-in-out infinite}
  @keyframes drift{50%{transform:translate(40px,-30px) scale(1.08)}}
  .scan{position:absolute;left:0;right:0;height:120px;background:linear-gradient(transparent,color-mix(in srgb,var(--accent) 7%,transparent),transparent);animation:scan 9s linear infinite;pointer-events:none}
  @keyframes scan{from{top:-120px}to{top:100%}}
  .glass{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  /* Borde luminoso que gira alrededor del formulario */
  .neon{position:relative;border-radius:20px;padding:1.5px;background:linear-gradient(#0000,#0000) padding-box;isolation:isolate}
  .neon::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 55%,var(--accent) 70%,var(--gold) 80%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;z-index:-1}
  .neon::after{content:'';position:absolute;inset:-30px;border-radius:40px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 18%,transparent),transparent);z-index:-2;filter:blur(20px)}
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes spin{to{--ang:360deg}}
  .text-grad{background:linear-gradient(100deg,#fff 0%,var(--accent) 50%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:#0b0b0b;font-weight:700;font-size:16px;padding:17px 30px;border-radius:10px;border:0;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s;font-family:Inter,sans-serif;position:relative;overflow:hidden}
  .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.2s ease-in-out infinite}
  @keyframes shine{60%,100%{transform:translateX(100%)}}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px color-mix(in srgb,var(--accent) 50%,transparent)}
  .btn:disabled{opacity:.7;cursor:wait}
  .btn-ghost{background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--line);font-weight:600}
  .btn-ghost::after{display:none}
  .btn-ghost:hover{border-color:var(--accent);box-shadow:none}

  /* ── Barra superior ── */
  .top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 20px;max-width:1160px;margin:0 auto}
  .top .logos{display:flex;align-items:center;gap:16px}
  .top .sep{width:1px;height:26px;background:rgba(255,255,255,.18)}
  .top .sponsor-logo{height:34px;border-radius:3px}
  .top .lm-logo{height:16px;opacity:.9}
  .top .tz{font-size:12px;color:var(--text2)}

  /* ── Portada ── */
  .hero{position:relative;overflow:hidden;padding:22px 0 90px}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.34;filter:saturate(.85)}
  .hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,7,15,.92) 0%,rgba(3,7,15,.7) 55%,rgba(3,7,15,.45) 100%),linear-gradient(180deg,transparent 55%,var(--bg))}
  .hero-grid{position:relative;display:grid;grid-template-columns:1.12fr .88fr;grid-template-areas:"top form" "details form";column-gap:52px;align-items:start}
  .h-top{grid-area:top}.h-details{grid-area:details}#register{grid-area:form}
  .pill{display:inline-flex;align-items:center;gap:9px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);padding:7px 14px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.3}}
  .hook{font-size:18px;color:var(--gold);font-weight:500;margin-bottom:14px;max-width:620px}
  .hero h1{font-size:clamp(34px,5.4vw,62px);font-weight:700;margin-bottom:20px}
  .hero h1.long{font-size:clamp(30px,4.2vw,50px)}
  .hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .sub{font-size:17px;color:var(--text2);max-width:600px;margin-bottom:24px}
  .when{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:9px 14px;border-radius:10px;font-size:14px}
  .chip b{color:var(--text);font-weight:600}
  .chip span{color:var(--text2)}
  .faces{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .faces .stack{display:flex}
  .faces .stack img,.faces .stack div{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--bg);margin-left:-10px;background:#0d1b33;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';color:var(--accent);font-size:15px}
  .faces .stack :first-child{margin-left:0}
  .faces p{font-size:13.5px;color:var(--text2);line-height:1.45}
  .faces p b{color:var(--text)}
  .proof{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .proof .chip b{font-family:'Space Grotesk';color:var(--accent);font-size:16px}
  .cd{display:flex;gap:10px}
  .cd div{min-width:72px;text-align:center;padding:12px 10px}
  .cd .n{font-family:'Space Grotesk';font-size:30px;font-weight:700;line-height:1}
  .cd .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
  .teaser{margin-top:22px;max-width:520px}
  .teaser video{width:100%;border-radius:12px;border:1px solid var(--line)}
  .li-event{display:inline-block;margin-top:14px;font-size:13.5px;color:var(--text2)}
  .li-event a{color:var(--accent)}

  /* ── Formulario ── */
  .form-box{border-radius:20px;background:rgba(6,15,31,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .form,.done{padding:28px}
  .form h2{font-size:26px;margin-bottom:4px}
  .form .form-sub{font-size:14px;color:var(--text2);margin-bottom:18px}
  .count{display:none;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin-bottom:16px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
  .count b{color:var(--accent);font-family:'Space Grotesk';font-size:16px}
  .count .live{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:blink 1.6s infinite}
  .f-label{display:block;margin-bottom:12px}
  .f-label > span{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#C9D6E6;margin-bottom:7px}
  .field{width:100%;background:#102440;border:1.5px solid rgba(150,185,235,.42);color:#fff;border-radius:10px;padding:14px 15px;font:inherit;font-size:16px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px rgba(0,0,0,.2);transition:border-color .2s,box-shadow .2s,background .2s}
  .field::placeholder{color:#8196B0;opacity:1}
  .field:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
  select.field{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#C9D6E6 50%),linear-gradient(135deg,#C9D6E6 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
  .field:focus{border-color:var(--accent);background:#132B4C;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 28%,transparent),0 0 24px color-mix(in srgb,var(--accent) 25%,transparent)}
  .fill-hint{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:#fff;font-weight:600;font-size:14px;transition:opacity .3s,max-height .3s,margin .3s,padding .3s;overflow:hidden;max-height:60px}
  .fill-hint .arrow{display:inline-block;color:var(--accent);font-size:18px;animation:nudge 1.2s ease-in-out infinite}
  .fill-hint.gone{opacity:0;max-height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0}
  @keyframes nudge{50%{transform:translateY(4px)}}
  .phone{display:grid;grid-template-columns:118px 1fr;gap:8px}
  .hint{display:block;font-size:12px;color:var(--dim);margin-top:5px}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--text2);margin:4px 0 16px;line-height:1.5}
  .consent input{width:18px;height:18px;margin-top:2px;flex-shrink:0;accent-color:var(--accent)}
  .form .btn{width:100%}
  .err{color:#fca5a5;font-size:13px;margin-bottom:10px;display:none}
  .trust{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--dim)}
  .trust span::before{content:'✓ ';color:var(--accent)}
  .trap{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

  /* ── Después de inscribirse ── */
  .done{display:none}
  .done .check{width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent);margin-bottom:14px;box-shadow:0 0 30px color-mix(in srgb,var(--accent) 35%,transparent)}
  .done h2{font-size:24px;margin-bottom:6px}
  .done > p{color:var(--text2);font-size:14.5px;margin-bottom:14px}
  .done .actions{display:grid;gap:8px;margin-bottom:18px}
  .done .actions a{font-size:14px;padding:12px 16px}
  .block{border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
  .block h3{font-size:16px;margin-bottom:4px}
  .block > p{font-size:13px;color:var(--text2);margin-bottom:12px}
  .block .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .block .btn{width:100%;padding:12px;font-size:14px}
  .saved{font-size:13px;color:#86efac;display:none;margin-top:8px}
  .share{display:flex;gap:8px;flex-wrap:wrap}
  .share .btn{flex:1;min-width:110px;padding:11px 12px;font-size:13.5px}

  /* ── Secciones ── */
  section{padding:84px 0;position:relative}
  section h2.t{font-size:clamp(28px,3.7vw,44px);margin:12px 0 14px;max-width:820px}
  section .lead{color:var(--text2);max-width:660px;font-size:16.5px}
  .alt{background:var(--bg2)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
  .stat{padding:24px}
  .stat .v{font-family:'Space Grotesk';font-size:42px;font-weight:700;line-height:1}
  .stat .k{font-size:13px;color:var(--text2);margin-top:10px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}
  .card{padding:22px;transition:transform .25s,border-color .25s}
  .card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
  .card .i{font-family:'IBM Plex Mono';font-size:11px;color:var(--accent);letter-spacing:.14em}
  .card h3{font-size:18px;margin:8px 0}
  .card p{font-size:14px;color:var(--text2)}
  .speakers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:34px}
  .spk{padding:22px;display:flex;flex-direction:column;gap:10px}
  .spk .ph{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 0 4px rgba(255,255,255,.02),0 0 24px color-mix(in srgb,var(--accent) 20%,transparent);background:#0d1b33;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-size:26px;color:var(--accent)}
  .spk .tag{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .spk h3{font-size:19px}
  .spk .role{font-size:13px;color:var(--text2)}
  .spk p{font-size:13.5px;color:var(--text2)}
  .agenda{margin-top:34px;display:grid;gap:10px}
  .ag{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 20px}
  .ag .h{font-family:'IBM Plex Mono';color:var(--accent);font-size:14px}
  .ag h3{font-size:17px;margin-bottom:4px}
  .ag p{font-size:14px;color:var(--text2)}
  .ag .by{color:var(--accent);font-size:13px;margin-top:6px;font-weight:500}
  .ag .h{white-space:nowrap}
  .when .also{flex-basis:100%;font-size:14px;color:var(--text2);padding-left:2px}
  .spk.soon{border-style:dashed}
  .spk.soon .ph{font-size:34px;color:var(--accent)}
  .aud-g{padding:20px 22px;flex:1 1 100%;display:grid;gap:12px}
  .aud-g .tag{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .aud-g>div{display:flex;flex-wrap:wrap;gap:8px}
  .aud{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .faq{margin-top:30px;display:grid;gap:10px;max-width:820px}
  .faq details{padding:18px 20px}
  .faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
  .faq summary::after{content:'+';color:var(--accent);font-family:'Space Grotesk';font-size:20px;line-height:1}
  .faq details[open] summary::after{content:'−'}
  .faq details p{color:var(--text2);font-size:14.5px;margin-top:10px}
  .final{text-align:center;overflow:hidden}
  .final h2.t{margin-left:auto;margin-right:auto}
  footer{border-top:1px solid var(--line);padding:30px 0 120px;color:var(--dim);font-size:12.5px;text-align:center}

  /* ── Barra fija en celular ── */
  .sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(3,7,15,.92);border-top:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;transition:transform .25s}
  .sticky .btn{width:100%;padding:15px}
  .sticky.hide{transform:translateY(115%)}

  .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:920px){
    .hero-grid{grid-template-columns:1fr;grid-template-areas:"top" "form" "details";row-gap:28px}
    .hero-shade{background:linear-gradient(180deg,rgba(3,7,15,.75),rgba(3,7,15,.92) 60%,var(--bg))}
    .stats{grid-template-columns:1fr 1fr}
    .cards{grid-template-columns:1fr}
    .sticky{display:block}
    .top .tz{display:none}
  }
  @media (max-width:520px){
    .block .row{grid-template-columns:1fr}
    .ag{grid-template-columns:1fr;gap:6px}
    .cd div{min-width:0;flex:1}
    .form,.done{padding:22px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="top">
  <div class="logos">
    <img class="sponsor-logo" id="sponsor-logo" alt="">
    <span class="sep"></span>
    <img class="lm-logo" src="limitless-logo.svg" alt="Limitless Media">
  </div>
  <span class="tz mono" id="tz-note"></span>
</header>

<main>
  <section class="hero" id="top">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-shade"></div>
    <div class="grid-bg"></div>
    <div class="floor"></div>
    <div class="scan"></div>
    <div class="orb" style="width:520px;height:520px;right:-8%;top:4%;background:color-mix(in srgb,var(--accent) 34%,transparent);opacity:.45"></div>
    <div class="orb" style="width:420px;height:420px;left:-10%;top:40%;background:color-mix(in srgb,var(--brand) 60%,transparent);opacity:.35;animation-delay:-8s"></div>

    <div class="wrap hero-grid">
      <div class="h-top">
        <div class="pill"><span class="dot"></span><span id="pill"></span></div>
        <p class="hook" id="hook"></p>
        <h1 id="title"></h1>
      </div>
      <div class="h-details">

  ["Argentina", "54", ["America/Argentina/Buenos_Aires", "America/Buenos_Aires", "America/Argentina/Cordoba", "America/Argentina/Mendoza", "America/Argentina/Salta", "America/Argentina/Tucuman", "America/Argentina/Ushuaia"]],
  ["Panamá", "507", ["America/Panama"]], ["Costa Rica", "506", ["America/Costa_Rica"]], ["Ecuador", "593", ["America/Guayaquil"]],
  ["Guatemala", "502", ["America/Guatemala"]], ["República Dominicana", "1", ["America/Santo_Domingo"]], ["Uruguay", "598", ["America/Montevideo"]],
  ["Paraguay", "595", ["America/Asuncion"]], ["Bolivia", "591", ["America/La_Paz"]], ["El Salvador", "503", ["America/El_Salvador"]],
  ["Honduras", "504", ["America/Tegucigalpa"]], ["Nicaragua", "505", ["America/Managua"]], ["Venezuela", "58", ["America/Caracas"]],
  ["Estados Unidos", "1", ["America/New_York", "America/Chicago", "America/Denver", "America/Los_Angeles", "America/Phoenix", "America/Detroit", "America/Indiana/Indianapolis", "America/Anchorage", "Pacific/Honolulu", "America/Boise", "America/Kentucky/Louisville"]],
  ["España", "34", ["Europe/Madrid"]], ["Otro", "", []],
];

/* ════ De aquí para abajo, el motor (no se toca por evento) ════ */
const E = EVENTO, T = UI[E.lang] || UI.es;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const locale = { es: "es-MX", pt: "pt-BR", en: "en-US" }[E.lang] || "es-MX";
const tbd = !E.start; // fecha por anunciar
const start = new Date(E.start || "2100-01-01T00:00:00Z"), end = new Date(start.getTime() + E.duration * 60000);
// ?simular=antes muestra la página como si faltaran 3 días (para revisar antes de publicar)
const params = new URLSearchParams(location.search);
const now = () => (params.get("simular") === "antes" ? new Date(start.getTime() - 3 * 864e5 + (Date.now() % 864e5)) : new Date());
const ended = () => now() > end;
const plainTitle = E.title.replace(/<[^>]+>/g, "");
const pageUrl = location.origin + location.pathname;
const userTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
// País sugerido: el de la zona horaria de quien visita; si no se reconoce, el
// país de la hora de referencia del evento (México para un evento en Monterrey).
const guess = COUNTRIES.find((c) => c[2].includes(userTz)) || COUNTRIES.find((c) => c[2].includes(E.refTimeZone)) || COUNTRIES.find((c) => c[0] === "Otro");

document.documentElement.lang = locale;
document.documentElement.style.setProperty("--brand", E.sponsor.brand);
document.documentElement.style.setProperty("--accent", E.sponsor.accent);

// ── Portada ──
$("sponsor-logo").src = E.sponsor.logo; $("sponsor-logo").alt = E.sponsor.name;
if (E.heroImage) $("hero-bg").style.backgroundImage = `url('${E.heroImage}')`;
$("pill").textContent = ended() ? T.ended : E.pill; $("hook").textContent = E.hook; $("title").innerHTML = E.title; if (E.title.replace(/<[^>]+>/g, "").length > 70) $("title").classList.add("long"); $("sub").textContent = E.sub;

const fmt = (d, tz, o) => new Intl.DateTimeFormat(locale, { timeZone: tz, ...o }).format(d);
const dayTxt = fmt(start, userTz, { weekday: "long", day: "numeric", month: "long" });
const hm = E.lang === "pt" ? { hour: "2-digit", minute: "2-digit" } : { hour: "numeric", minute: "2-digit", hour12: true };
const timeTxt = fmt(start, userTz, hm);
const refTxt = fmt(start, E.refTimeZone, hm);
const known = [E.refTimeZone, "America/Mexico_City", "America/Monterrey", "America/Bogota", "America/Tijuana"];
const yourTxt = !known.includes(userTz) && !tbd ? ` · ${T.yourTime}: ${timeTxt}` : "";
const dayRef = fmt(start, E.refTimeZone, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
$("when").innerHTML = tbd
  ? `<span class="chip"><b>${esc(T.tbd)}</b><span>${esc(T.tbdSub)}</span></span><span class="chip"><span>${esc(T.free)} · ${E.duration} min</span></span>`
  : `<span class="chip"><b>${esc(dayRef.charAt(0).toUpperCase() + dayRef.slice(1))}</b></span>` +
  `<span class="chip"><b>${esc(refTxt)}</b><span>${esc(E.refTimeLabel)}</span></span>` +
  `<span class="chip"><span>${esc(T.free)} · ${E.duration} min</span></span>` +
  ((E.otherTimes || yourTxt) ? `<div class="also">${esc(E.otherTimes || "")}${esc(yourTxt)}</div>` : "");
$("tz-note").textContent = tbd ? "" : `${timeTxt} · ${userTz.split("/").pop().replace(/_/g, " ")}`;

// Caras de los oradores junto al título
const initials = (n) => n.split(" ").map((w) => w[0]).slice(0, 2).join("");
const confirmed = E.speakers.filter((s) => !s.soon);
const names = confirmed.map((s) => s.name.split(" ")[0]);
if (!confirmed.length) $("faces").innerHTML = `<span class="chip"><b>${esc(T.panelTbd)}</b></span>`;
else $("faces").innerHTML = `<div class="stack">${confirmed.map((s) => (s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.name)}" data-ini="${esc(initials(s.name))}">` : `<div>${esc(initials(s.name))}</div>`)).join("")}</div>` +
  `<p>${esc(T.speakersWith)} <b>${esc(names.length > 1 ? names.slice(0, -1).join(", ") + " " + T.and + " " + names[names.length - 1] : names[0] || "")}</b><br>${esc(confirmed.slice(0, 3).map((s) => s.role.split("·")[0].trim()).join(" · "))}</p>`;

// Resultados reales de ediciones anteriores (solo si se cargan en EVENTO.proof)
$("proof").innerHTML = E.proof.map(([v, k]) => `<span class="chip"><b>${esc(v)}</b><span>${esc(k)}</span></span>`).join("");
if (E.teaserVideo) $("teaser").innerHTML = `<video src="${esc(E.teaserVideo)}" controls playsinline preload="metadata"></video>`;
if (E.linkedinEvent) $("li-event").innerHTML = `${esc(T.liEvent)} <a href="${esc(E.linkedinEvent)}" target="_blank" rel="noopener">${esc(T.liEventLink)}</a>.`;

// Cuenta regresiva
function tick() {
  if (tbd) return;
  const ms = start - now();
  if (ms <= 0) { $("cd").innerHTML = ended() ? "" : `<div class="glass"><div class="n text-grad">●</div><div class="l">${esc(T.live)}</div></div>`; return; }
  const u = [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60];
  $("cd").innerHTML = [T.days, T.hours, T.min, T.sec].map((l, i) => `<div class="glass"><div class="n text-grad">${String(u[i]).padStart(2, "0")}</div><div class="l">${esc(l)}</div></div>`).join("");
}
tick(); setInterval(tick, 1000);

// Contador real de inscritos (desde la hoja). Solo aparece al pasar el mínimo.
if (FORMS_URL && !ended()) {
  fetch(`${FORMS_URL}?count=${encodeURIComponent(E.slug)}`).then((r) => r.json()).then((d) => {
    if (d && d.count >= E.showCountFrom) { $("count").style.display = "flex"; $("count-txt").innerHTML = `<b>${d.count}</b> ${esc(T.count)}`; }
  }).catch(() => {});
}

// ── Secciones ──
$("p-label").textContent = T.pLabel; $("p-title").textContent = E.problem.title; $("p-body").textContent = E.problem.body;
$("stats").innerHTML = E.problem.stats.map(([v, k]) => `<div class="glass stat reveal"><div class="v text-grad">${esc(v)}</div><div class="k">${esc(k)}</div></div>`).join("");
$("dl-label").textContent = T.dlLabel; $("dl-title").textContent = T.dlTitle;
$("cards").innerHTML = E.deliverables.map(([h, p], i) => `<div class="glass card reveal"><span class="i">0${i + 1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");
if (!E.speakers.length) $("speakers").closest("section").style.display = "none";
$("sp-label").textContent = T.spLabel; $("sp-title").textContent = T.spTitle;
$("speakers").innerHTML = E.speakers.map((s) => `<div class="glass spk reveal${s.soon ? " soon" : ""}">${s.photo ? `<img class="ph" src="${esc(s.photo)}" alt="${esc(s.name)}" loading="lazy" data-ini="${esc(initials(s.name))}">` : `<div class="ph">${s.soon ? "+" : esc(initials(s.name))}</div>`}<span class="tag">${esc(s.tag)}</span><h3>${esc(s.name)}</h3><div class="role">${esc(s.role)}</div><p>${esc(s.bio)}</p></div>`).join("");
// Si falta la foto de un orador, se muestran sus iniciales en vez de una imagen rota.
document.querySelectorAll("img[data-ini]").forEach((img) => {
  const swap = () => { const d = document.createElement("div"); d.className = img.className; d.textContent = img.dataset.ini; img.replaceWith(d); };
  if (img.complete && !img.naturalWidth) swap(); else img.addEventListener("error", swap);
});
$("ag-label").textContent = T.agLabel; $("ag-title").textContent = T.agTitle;
let offset = 0;
$("agenda").innerHTML = E.agenda.map(([dur, t, p, by]) => {
  const at = new Date(start.getTime() + offset * 60000); offset += Number(dur) || 0;
  const h = tbd ? `${dur} min` : `${fmt(at, userTz, hm)} · ${dur} min`;
  return `<div class="glass ag reveal"><div class="h">${esc(h)}</div><div><h3>${esc(t)}</h3>${p ? `<p>${esc(p)}</p>` : ""}${by ? `<p class="by">${esc(by)}</p>` : ""}</div></div>`;
}).join("");
$("au-label").textContent = T.auLabel; $("au-title").textContent = E.audienceTitle || T.auTitle;
$("audience").innerHTML = E.audience.map((a) => Array.isArray(a)
  ? `<div class="glass aud-g reveal"><span class="tag">${esc(a[0])}</span><div>${a[1].map((x) => `<span class="chip"><b>${esc(x)}</b></span>`).join("")}</div></div>`
  : `<span class="chip reveal"><b>${esc(a)}</b></span>`).join("");
$("fq-label").textContent = T.fqLabel; $("fq-title").textContent = T.fqTitle;
$("faq").innerHTML = [...E.faq, ...T.faq].map(([q, a]) => `<details class="glass reveal"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
$("final-title").textContent = E.finalTitle; $("final-sub").textContent = T.finalSub;
$("footer").textContent = `${E.sponsor.name} × ${T.footer}`;

// Aparición suave al bajar
const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && (e.target.classList.add("in"), io.unobserve(e.target))), { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

// ── Formulario ──
$("l-name").textContent = T.name; $("l-email").textContent = T.email;
$("fill-hint-txt").textContent = T.fillHint;
document.querySelector('#form [name="name"]').placeholder = T.namePh;
document.querySelector('#form [name="email"]').placeholder = T.emailPh;
// La indicación desaparece en cuanto la persona empieza a llenar
$("form").addEventListener("focusin", () => $("fill-hint").classList.add("gone"), { once: true });
$("l-wa").textContent = T.wa + (E.whatsappRequired ? "" : T.waOpt); $("wa-hint").textContent = T.waHint;
$("l-consent").textContent = T.consent; $("f-sub").textContent = T.fSub;
$("trust").innerHTML = T.trust.map((t) => `<span>${esc(t)}</span>`).join("");
const ISO = { "Brasil": "BR", "México": "MX", "Colombia": "CO", "Chile": "CL", "Perú": "PE", "Argentina": "AR", "Panamá": "PA", "Costa Rica": "CR", "Ecuador": "EC", "Guatemala": "GT", "República Dominicana": "DO", "Uruguay": "UY", "Paraguay": "PY", "Bolivia": "BO", "El Salvador": "SV", "Honduras": "HN", "Nicaragua": "NI", "Venezuela": "VE", "Estados Unidos": "US", "España": "ES" };
const dialOpts = COUNTRIES.filter((c) => c[1]).map((c) => `<option value="${c[1]}" title="${esc(c[0])}"${c === guess ? " selected" : ""}>${ISO[c[0]]} +${c[1]}</option>`).join("");
$("dial").innerHTML = dialOpts;
const PHONE_PH = { "52": "81 1234 5678", "55": "11 91234 5678", "57": "300 123 4567", "56": "9 1234 5678", "51": "912 345 678", "54": "11 2345 6789", "1": "555 123 4567", "34": "612 34 56 78" };
const setPhonePh = () => ($("phone").placeholder = PHONE_PH[$("dial").value] || "Número");
setPhonePh(); $("dial").addEventListener("change", setPhonePh);

const setCtas = () => {
  const done = ended();
  $("f-title").textContent = done ? T.endedForm : T.fTitle;
  $("submit").textContent = done ? T.endedSubmit : T.submit;
  $("final-cta").textContent = $("sticky-cta").textContent = done && E.replayUrl ? T.endedCta : T.cta;
  if (done && E.replayUrl) $("final-cta").href = $("sticky-cta").href = E.replayUrl;
};
setCtas();

// En celular, la barra fija se esconde mientras el formulario está a la vista
new IntersectionObserver(([e]) => $("sticky").classList.toggle("hide", e.isIntersecting), { threshold: 0.12 }).observe($("register"));

// Origen de la visita: ?utm_source=linkedin, ?ref=whatsapp o el sitio de donde viene
const source = params.get("utm_source") || params.get("ref") || (document.referrer ? new URL(document.referrer).hostname : "");

const send = (payload) => fetch(FORMS_URL, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
let registeredEmail = "";

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const name = String(f.get("name") || "").trim();
  const email = String(f.get("email") || "").trim();
  let digits = String(f.get("phone") || "").replace(/\D/g, "").replace(/^0+/, "");
  const dial = String(f.get("dial") || "");
  if (digits && dial && digits.startsWith(dial) && digits.length > 10) digits = digits.slice(dial.length); // ya lo escribió con código
  const whatsapp = digits ? dial + digits : "";
  const err = (m) => { $("err").textContent = m; $("err").style.display = "block"; };
  if (!name || !/\S+@\S+\.\S+/.test(email) || !f.get("consent")) return err(T.errReq);
  if ((E.whatsappRequired && digits.length < 7) || (digits && digits.length < 7)) return err(T.errWa);
  $("err").style.display = "none";
  $("submit").disabled = true; $("submit").textContent = T.sending;
  try {
    await send({ type: "webinar", event: E.slug, title: plainTitle, start: E.start, duration: E.duration, lang: E.lang, page: pageUrl,
      name, email, whatsapp, consent: true, source, website: String(f.get("website") || "") });
    registeredEmail = email;
    showDone(name);
  } catch (e) {
    err(T.errNet); $("submit").disabled = false; setCtas();
  }
});

// Paso 2 (opcional): empresa, cargo y país
$("more").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  send({ type: "webinar_update", event: E.slug, email: registeredEmail, company: f.get("company"), role: f.get("role"), country: f.get("country") }).catch(() => {});
  $("m-submit").style.display = "none"; $("m-saved").style.display = "block";
});

function showDone(name) {
  const utc = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  $("cal-google").href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(plainTitle)}&dates=${utc(start)}/${utc(end)}&details=${encodeURIComponent(pageUrl)}`;
  $("cal-outlook").href = `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(plainTitle)}&startdt=${start.toISOString()}&enddt=${end.toISOString()}&body=${encodeURIComponent(pageUrl)}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Limitless Media//Webinar//ES", "BEGIN:VEVENT", `UID:${E.slug}@thelimitlessmedia.co`, `DTSTAMP:${utc(new Date())}`, `DTSTART:${utc(start)}`, `DTEND:${utc(end)}`, `SUMMARY:${plainTitle.replace(/[,;]/g, " ")}`, `URL:${pageUrl}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  $("cal-ics").href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  if (tbd) { document.querySelector(".done .actions").style.display = "none"; }
  $("cal-google").textContent = T.gcal; $("cal-outlook").textContent = T.outlook; $("cal-ics").textContent = T.ics;
  $("d-title").textContent = T.dTitle.replace("{n}", name.split(" ")[0]); $("d-sub").textContent = tbd ? T.dSubTbd : T.dSub;
  $("m-title").textContent = T.mTitle; $("m-sub").textContent = T.mSub; $("m-submit").textContent = T.mSubmit; $("m-saved").textContent = T.mSaved;
  $("m-company").placeholder = T.company; $("m-role").placeholder = T.role;
  $("m-country").innerHTML = `<option value="">${esc(T.country)}</option>` + COUNTRIES.map((c) => `<option${c === guess ? " selected" : ""}>${esc(c[0])}</option>`).join("");
  const share = `${T.shareText} ${plainTitle} ${pageUrl}?ref=colega`;
  $("s-wa").href = `https://wa.me/?text=${encodeURIComponent(share)}`;
  $("s-li").href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pageUrl + "?ref=linkedin-share")}`;
  $("s-title").textContent = T.sTitle; $("s-sub").textContent = T.sSub; $("s-copy").textContent = T.copy;
  $("s-copy").onclick = () => navigator.clipboard.writeText(`${pageUrl}?ref=colega`).then(() => ($("s-copy").textContent = T.copied));
  $("form").style.display = "none"; $("done").style.display = "block";
  $("sticky").style.display = "none";
  $("register").scrollIntoView({ behavior: "smooth", block: "start" });
}
</script>
</body>
</html>
